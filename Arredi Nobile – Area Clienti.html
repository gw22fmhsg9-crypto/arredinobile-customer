<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arredi Nobile – Area Clienti</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap');
:root{
  color-scheme:dark;
  --fg:#F4F0E8;
  --mut:#9C958A;
  --or:#F76000;
  --or2:#FF8A3D;
  --ln:rgba(244,240,232,.12);
  --b2:#141210;
  --b3:#1A1814;
  --bg:#0C0B09;
  --ff:"Outfit",system-ui,-apple-system,sans-serif;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--ff);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
button,input,textarea,label,select{font-family:var(--ff)}
.w{max-width:720px;margin:0 auto;padding:0 24px 100px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(12,11,9,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.hd img{height:40px;display:block;opacity:.95}
.hd>div{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--mut)}
.ey{font-size:12px;color:var(--mut);margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.ey b{color:var(--or);font-weight:500}
.dp{font-family:var(--serif);font-size:clamp(32px,6.5vw,48px);font-weight:500;line-height:1.15;margin:10px 0 0;letter-spacing:-.01em;color:var(--fg)}
.dp em{color:var(--or);font-style:italic;font-weight:400}
.it{font-size:16px;color:var(--mut);margin:12px 0 0;font-weight:300;line-height:1.65;max-width:34em}
.hero{padding-top:36px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px}
.st>div{background:var(--b2);border:1px solid var(--ln);border-radius:14px;padding:18px 16px}
.st .v{font-family:var(--serif);font-size:26px;font-weight:500;margin-top:6px;line-height:1.2;color:var(--fg)}
.st .v small{font-size:.55em;color:var(--mut);font-weight:400;font-family:var(--ff)}
.pg{height:3px;background:rgba(244,240,232,.08);border-radius:2px;margin-top:28px;position:relative;overflow:hidden}
.pg i{position:absolute;left:0;top:0;height:3px;background:linear-gradient(90deg,#E55500,var(--or2));border-radius:2px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.sec{margin-top:52px}
.sec>.ey{font-size:13px;color:var(--fg);font-weight:500;padding-bottom:16px;letter-spacing:.12em;border-bottom:1px solid var(--ln);margin-bottom:4px}
.sec>.ey b{color:inherit;font-weight:500}
.ph{display:grid;grid-template-columns:40px 1fr auto;gap:6px 14px;align-items:center;padding:18px 0;border-top:1px solid var(--ln)}
.ph:first-of-type{border-top:0}
.ph .n{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font-size:12px;color:var(--mut);font-weight:500;letter-spacing:.04em}
.ph .t{font-size:16px;font-weight:400;letter-spacing:.01em}
.ph .s{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px;letter-spacing:.06em;text-transform:uppercase}
.ph.on{background:rgba(247,96,0,.08);border-top-color:transparent;border-radius:12px;padding:18px 12px;margin:4px -12px;border:1px solid rgba(247,96,0,.22)}
.ph.on .n{border-color:var(--or);color:var(--or)}
.ph.on .s{color:var(--or);font-weight:500}
.ph.on .s:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--or);animation:pu 1.8s infinite}
@keyframes pu{50%{opacity:.3}}
.ph.dn .n{background:var(--or);border-color:var(--or);color:#0C0B09;font-weight:600}
.ph.dn .t{color:var(--mut)}
.seg{display:flex;gap:6px;grid-column:2/4;flex-wrap:wrap;margin-top:4px}
.seg button{background:none;border:1px solid var(--ln);color:var(--mut);font:500 12px var(--ff);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:36px;letter-spacing:.04em;text-transform:uppercase}
.seg button.a{background:var(--or);border-color:var(--or);color:#0C0B09}
.seg button:hover:not(.a){border-color:var(--or);color:var(--or)}
.en{display:block;padding:24px 0;border-top:1px solid var(--ln)}
.dt{font-size:12px;color:var(--mut);margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase}
.dt small{display:inline;font:inherit;margin-left:6px;letter-spacing:.04em;text-transform:none}
.tx{font-size:16px;margin:0;max-width:560px;font-weight:300;line-height:1.7;color:var(--fg)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.tl{position:relative;aspect-ratio:4/3;background:#151310;overflow:hidden;cursor:zoom-in;border-radius:10px;border:1px solid var(--ln)}
.tl img,.tl video{width:100%;height:100%;object-fit:cover;display:block}
.pl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.rm{position:absolute;top:8px;right:8px;background:rgba(12,11,9,.85);border:0;color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.btn{background:var(--or);color:#0C0B09;border:0;font:500 14px var(--ff);padding:14px 28px;border-radius:8px;cursor:pointer;min-height:50px;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,transform .15s}
.btn:hover{background:var(--or2)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.lk{background:none;border:1px solid var(--ln);border-radius:8px;color:var(--fg);font:400 13px var(--ff);padding:10px 16px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;letter-spacing:.03em;transition:border-color .2s,color .2s}
.lk:hover{border-color:var(--or);color:var(--or)}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.lr{display:grid;grid-template-columns:1fr 140px 64px;gap:12px;align-items:center;padding:18px 20px;margin-bottom:10px;background:var(--b2);border:1px solid var(--ln);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s}
.lr:hover{border-color:rgba(247,96,0,.4);background:var(--b3)}
.lr .n{display:none}
.lr .nm{font-size:17px;font-weight:500;line-height:1.3;letter-spacing:.01em}
.lr small{display:block;font-size:13px;color:var(--mut);font-weight:300;margin-top:4px}
.lr .f{font-size:13px;color:var(--mut);letter-spacing:.02em}
.lr .p{font-family:var(--serif);font-size:26px;font-weight:500;text-align:right;color:var(--or)}
.lr .p small{display:inline;font-size:.5em;font-family:var(--ff);color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:22px 0 8px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
input,textarea,select{width:100%;background:var(--b2);border:1px solid var(--ln);border-radius:10px;color:var(--fg);font:400 16px var(--ff);padding:14px 16px;outline:0;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--or)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input[type=file]{display:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--or);flex:none}
input[type=range]{padding:0;border:0;background:none;height:32px;accent-color:var(--or)}
.r2{display:flex;gap:10px;align-items:stretch}
.r2 input{flex:1}
.ov{position:fixed;inset:0;background:rgba(8,7,5,.94);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;overflow:auto;z-index:20;backdrop-filter:blur(8px)}
.md{width:100%;max-width:480px;background:#12110E;border:1px solid var(--ln);border-radius:18px;padding:32px 28px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.md h2{font-family:var(--serif);font-size:30px;font-weight:500;margin:6px 0 0;line-height:1.2}
.md h2 em{color:var(--or);font-style:italic;font-weight:400}
.cr{background:var(--b2);border:1px solid rgba(247,96,0,.35);border-radius:12px;padding:18px;margin-top:22px;font-size:18px;font-weight:400;line-height:1.6;word-break:break-all;font-family:var(--serif)}
.cr span{display:block;font-size:11px;color:var(--mut);font-weight:500;font-family:var(--ff);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.er{color:#E8A07A;font-size:14px;margin-top:14px}
.okk{color:#A8C9B0;font-size:14px;margin-top:14px}
.zm{max-width:1100px;width:100%}
.zm img,.zm video{width:100%;max-height:84vh;object-fit:contain;display:block;border-radius:8px}
.lg{min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:0 24px}
.lg img{height:110px;margin:0 auto 32px;display:block;opacity:.95}
.lg h1{font-family:var(--serif);font-size:36px;font-weight:500;line-height:1.15;text-align:center;margin:0 0 10px}
.lg h1 em{color:var(--or);font-style:italic;font-weight:400}
.mt{font-size:12px;color:var(--mut);line-height:1.9;margin-top:40px;text-align:center;letter-spacing:.04em}
.pill{font-size:12px;color:var(--or);letter-spacing:.08em}
@media(max-width:600px){
  .st{grid-template-columns:1fr}
  .lr{grid-template-columns:1fr 56px}
  .lr .f{display:none}
  .ph{grid-template-columns:40px 1fr}
  .ph .s{grid-column:2}
  .seg{grid-column:1/3}
  .w{padding:0 18px 90px}
}
.lg2{display:flex;gap:6px}
.lk.on{border-color:var(--or);color:var(--or)}
.lg2 .lk{padding:6px 12px;min-height:36px}
.mg{display:flex;flex-direction:column;gap:12px;margin:0 0 18px}
.bb{max-width:88%;background:var(--b2);border:1px solid var(--ln);border-radius:16px 16px 16px 4px;padding:14px 16px;align-self:flex-start}
.bb.me{align-self:flex-end;background:rgba(247,96,0,.1);border-color:rgba(247,96,0,.2);border-radius:16px 16px 4px 16px}
.bb small{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;letter-spacing:.04em}
.bb p{margin:0;white-space:pre-wrap;font-weight:300;line-height:1.55}
.dc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--ln)}
.dc small{display:block;color:var(--mut);font-size:12px;margin-top:3px;letter-spacing:.03em}
.dc div:last-child{display:flex;gap:8px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn-pdf{background:transparent;border:1px solid var(--ln);color:var(--mut);font:400 12px var(--ff);padding:10px 16px;border-radius:8px;cursor:pointer;min-height:40px;margin-top:16px;letter-spacing:.06em;text-transform:uppercase}
.btn-pdf:hover{border-color:var(--or);color:var(--or)}
.lang-wrap{position:relative;display:inline-flex;align-items:center}
.lang-btn{background:transparent;border:1px solid var(--ln);border-radius:8px;color:var(--mut);font:500 12px var(--ff);padding:8px 12px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:7px;letter-spacing:.08em}
.lang-btn:hover{border-color:var(--or);color:var(--or)}
.lang-btn .flag{font-size:15px;line-height:1}
.lang-btn .code{opacity:.9;font-size:11px;font-weight:600}
.lang-btn .chev{opacity:.4;font-size:9px;margin-left:1px}
.lang-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:#141210;border:1px solid var(--ln);border-radius:12px;padding:6px;z-index:30;box-shadow:0 16px 48px rgba(0,0,0,.55);max-height:min(70vh,380px);overflow:auto}
.lang-menu.open{display:block}
.lang-menu button{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;color:var(--fg);font:400 14px var(--ff);padding:11px 14px;border-radius:8px;cursor:pointer;text-align:left}
.lang-menu button:hover{background:rgba(247,96,0,.1);color:var(--or)}
.lang-menu button.on{background:rgba(247,96,0,.14);color:var(--or)}
.lang-menu .flag{font-size:18px;width:24px;text-align:center}
.lg .lang-wrap{align-self:flex-end;margin-bottom:8px}
@media print{
  :root{--fg:#111;--mut:#555;--ln:rgba(0,0,0,.2);--b2:#fff;--b3:#fff;--bg:#fff}
  body{background:#fff!important;color:#111!important}
  .hd,.btn,.lk,button,.lr,.seg,input,textarea,.lang-wrap,.btn-pdf,.mg+textarea,.ov{display:none!important}
  .tl{break-inside:avoid;cursor:default}
  .w{max-width:100%;padding:0}
  .ph.on{background:#f5f5f5;border-color:#ccc}
  .pg i{background:#333}
}


.tagline{margin:64px 0 28px;padding-top:36px;border-top:1px solid var(--ln);text-align:center}
.tagline p{font-family:var(--serif);font-size:clamp(18px,3.5vw,22px);font-weight:400;font-style:italic;color:var(--mut);margin:0;letter-spacing:.02em;line-height:1.4}
.tagline p em{color:var(--or);font-style:italic}
.tag-dot{width:4px;height:4px;border-radius:50%;background:var(--or);margin:18px auto;opacity:.85}
.tag-made{font-family:var(--ff)!important;font-size:10px!important;font-style:normal!important;font-weight:500!important;letter-spacing:.22em!important;text-transform:uppercase;color:var(--mut)!important;margin:0!important}
.lg .tagline{margin-top:48px;border-top:0;padding-top:0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c1a16;border:1px solid rgba(247,96,0,.5);color:var(--fg);padding:13px 20px;border-radius:12px;z-index:60;font-size:15px;max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.lk.dg{color:#ff8a4d;border-color:rgba(255,138,77,.4)}
</style>
</head>

else if(a==="notify"){const c=S.users.find(z=>z.email===p.client);modal={t:"notify",name:c.name,lang:c.lang||"it"}}
else if(a==="deliver"){p.status="delivered";p.progress=100;p.ph=p.ph.map(()=>"done");save()}
else if(a==="newpw"){const c=S.users.find(z=>z.email===p.client);const np=gen();await setpw(c,np);c.must=false;save();modal={t:"cred",email:c.email,name:c.name,pw:np}}
else if(a==="copy"){const c=modal,k=t.dataset.k,tx=k==="cred"?`Email: ${c.email}\nPassword: ${c.pw}`:k.startsWith("n-")?nmsg(k.slice(2),c.name):msg(k,c);modal.ok=(await cp(tx))?"Copiato negli appunti.":"Copia non riuscita: seleziona il testo a mano."}
render()});
document.addEventListener("input",e=>{if(e.target.id==="um")DRAFT=e.target.value;if(e.target.dataset&&e.target.dataset.pm)DRM[e.target.dataset.pm]=e.target.value});
document.addEventListener("change",async e=>{const el=e.target;if(el.dataset&&el.dataset.a==="langsel"){const v=el.value;const u=U();if(u&&u.role==="client"){u.lang=v;save()}else{LG=v}render();return}const p=S.projects.find(x=>x.id===pid);
if(el.id==="impdb"&&el.files[0]){try{const txt=await el.files[0].text();const parsed=JSON.parse(txt);if(parsed&&Array.isArray(parsed.users)&&Array.isArray(parsed.projects)){for(const usr of parsed.users){if(!S.users.some(x=>x.email===usr.email))S.users.push(usr)}for(const prj of parsed.projects){if(!S.projects.some(x=>x.id===prj.id))S.projects.push(prj)}save();toast("Backup clienti ripristinato.");render()}else{toast("File di backup non valido.")}}catch(err){toast("Errore durante la lettura del file.")}el.value="";return}
if(el.id==="uf"){err="";for(const f of el.files){const v=f.type.startsWith("video/");if(v&&f.size>250*1048576){err="Il video "+f.name+" supera i 250 MB.";continue}PEND.push({f,t:v?"vid":"img",u:URL.createObjectURL(f)})}el.value="";render();return}
if(el.id==="df"&&p){const bad=[];for(const f of [...el.files]){if(f.size>50*1048576){bad.push(f.name+" (oltre 50 MB)");continue}const id=uid(),u=await cloud(f);if(!u){if(!(await mput(id,f))){bad.push(f.name);continue}URLS[id]=URL.createObjectURL(f)}(p.docs=p.docs||[]).push({id,name:f.name,size:f.size,ts:new Date().toISOString(),u})}el.value="";save();render();if(bad.length)toast("Non caricati: "+bad.join(", "));return}
const c=el.dataset.c;if(!c)return;if(c==="clang"){const cu=S.users.find(u=>u.email===p.client);if(cu){cu.lang=el.value;save();render()}return}if(!p)return;if(c==="prog")p.progress=+el.value;if(c==="eta")p.eta=el.value;save();render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal){modal=null;render()}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),k=e.target.dataset.f;
if(k==="login"){const em=(f.email||"").trim().toLowerCase(),u=S.users.find(x=>x.email===em);if(!u||!(await okpw(u,f.pw||""))){err=T("bad");render();return}
if(!u.ph&&window.crypto&&crypto.subtle){await setpw(u,f.pw);save()}
err="";me=u.email;if(u.role==="client"&&!u.lang){u.lang=LG;save()}page=u.role==="admin"?"admin":u.must?"chpw":"client"}
if(k==="chpw"){if((f.pw||"").length<8){err=T("sh");render();return}err="";const u=U();await setpw(u,f.pw);u.must=false;save();page="client"}
if(k==="add"||k==="addadm"){const em=(f.email||"").trim().toLowerCase(),adm=k==="addadm";modal.v=f;
if(S.users.some(x=>x.email===em)){modal.err="Esiste già un utente con questa email: "+em;render();return}
if((f.pw||"").length<8){modal.err="La password deve avere almeno 8 caratteri.";render();return}
const nu={email:em,name:(f.name||"").trim(),role:adm?"admin":"client",must:!adm&&!!f.must,lang:adm?undefined:(f.lang||"it")};await setpw(nu,f.pw);S.users.push(nu);
if(!adm)S.projects.push({id:"p"+uid(),client:em,title:(f.title||"").trim(),desc:(f.desc||"").trim(),eta:f.eta||"",progress:0,ph:["pending","pending","pending","pending","pending","pending"],msgs:[],docs:[],upd:[]});
save();modal={t:"cred",email:em,name:nu.name,pw:f.pw,adm}}
render()});
window.addEventListener("storage",e=>{if(e.key===K&&e.newValue){S=JSON.parse(e.newValue);if(!busy&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()}});

/* ===== Salvataggio sul server (capability db) ===== */

function sid(s){return String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").slice(0,150)}
function upath(u){return"users/"+sid(u.email)}
function ppath(p){return"projects/"+sid(p.id)}
function syncText(){return !DB?"Server non disponibile: i clienti sono salvati solo su questo browser. Fai ogni tanto un backup.":SYNCERR?"Salvataggio sul server non riuscito ("+SYNCERR+"). I dati sono comunque su questo dispositivo.":READY.users&&READY.projects?"✓ Clienti salvati sul server: restano per sempre finché non li elimini tu.":"Collegamento al server…"}
function showSync(){const el=document.getElementById("syncst");if(el)el.textContent=syncText()}
function pushSoon(){if(!DB)return;clearTimeout(SYT);SYT=setTimeout(pushNow,500)}
const cl2=o=>JSON.parse(JSON.stringify(o));
async function pushNow(){if(!DB||!READY.users||!READY.projects)return;
try{for(const u of S.users){const path=upath(u),j=JSON.stringify(u);if(LAST[path]!==j){await DB.doc(path).set(cl2(u));LAST[path]=j}}
for(const p of S.projects){const path=ppath(p),j=JSON.stringify(p);if(LAST[path]!==j){await DB.doc(path).set(cl2(p));LAST[path]=j}}SYNCERR=""}catch(e){SYNCERR=(e&&e.code)||"errore"}showSync()}
async function cloud(b){if(!AS||!b||b.size>20*1048576)return"";try{const r=await AS.upload(b);return"/_blob/"+r.id}catch(e){return""}}
function onSnap(kind,snap){const arr=kind==="users"?S.users:S.projects,pf=kind==="users"?upath:ppath;let ch=false;
for(const d of snap.docs){const v=d.data();if(!v)continue;const path=kind+"/"+d.id,j=JSON.stringify(v),i=arr.findIndex(x=>pf(x)===path);
if(i<0){arr.push(cl2(v));ch=true}else{const local=JSON.stringify(arr[i]);if(local!==j&&!(LAST[path]!==undefined&&local!==LAST[path])){arr[i]=cl2(v);ch=true}}LAST[path]=j}
if(!snap.metadata.fromCache){for(const c of snap.docChanges()){if(c.type!=="removed")continue;const path=kind+"/"+c.doc.id,i=arr.findIndex(x=>pf(x)===path);if(i>=0&&!(kind==="users"&&arr[i].role==="admin")){arr.splice(i,1);delete LAST[path];ch=true}}
READY[kind]=true;pushSoon()}
if(ch){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(!busy&&!modal&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}
showSync()}
async function initDb(){try{if(!window.claude||!claude.use)return;const d=await claude.use("db");if(!d)return;DB=d;try{AS=await claude.use("assets")}catch(e){AS=null}
const er=e=>{SYNCERR=(e&&e.code)||"errore";showSync()};
DB.collection("users").onSnapshot(s=>onSnap("users",s),er);DB.collection("projects").onSnapshot(s=>onSnap("projects",s),er);showSync()}catch(e){DB=null}}
initDb();

render();
</script>
